<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · 李牧唐</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf9f7">
  <!-- 404 页可能出现在任意层级的路径下，所以样式全部内联，不引用任何相对路径的文件 -->
  <style>
    :root {
      color-scheme: light;
      --bg: #faf9f7;
      --fg: #171615;
      --muted: #5a5751;
      --line: #e4e0d8;
      --accent: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    main {
      display: grid;
      justify-items: start;
      gap: 1rem;
      width: min(100%, 34rem);
    }
    .code {
      margin: 0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    p { margin: 0; color: var(--muted); }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.1rem;
    }
    a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>这一页还没有接入。</h1>
    <p>你要找的页面不存在，或者它还在路上。回到首页，看看已经开放的入口。</p>
    <a id="home" href="/">回到首页</a>
  </main>
  <script>
    /* GitHub Pages 的项目站点挂在 /仓库名/ 下面：试探一下，把「回到首页」指到正确的位置。 */
    (function () {
      var link = document.getElementById('home');
      var first = location.pathname.split('/')[1];
      if (!first || !/\.github\.io$/.test(location.hostname)) return;
      var base = '/' + first + '/';
      fetch(base, { method: 'HEAD' })
        .then(function (res) { if (res.ok) link.href = base; })
        .catch(function () { /* 保持默认的根路径 */ });
    })();
  </script>
</body>
</html>
